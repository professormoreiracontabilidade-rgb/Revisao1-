<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiz 1 - Questões 1 a 15</title><style>
:root{--azul:#0b4f8a;--azul2:#eaf4ff;--verde:#16834b;--vermelho:#c62828;--amarelo:#fff4c2;--texto:#102235}
*{box-sizing:border-box} body{margin:0;background:#f2f6fb;font-family:Arial,Helvetica,sans-serif;color:var(--texto)}
.app{max-width:760px;margin:auto;min-height:100vh;background:white;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--azul);color:white;padding:14px 16px}.brand{font-weight:800;font-size:18px}.sub{font-size:13px;opacity:.95;margin-top:3px}.progress{font-weight:700;margin-top:8px}
.screen{padding:18px 16px 110px;flex:1}.meta{background:var(--azul2);border-left:5px solid var(--azul);padding:10px 12px;border-radius:8px;margin-bottom:14px;font-weight:700;line-height:1.35}.qtitle{font-size:23px;font-weight:900;color:var(--azul);margin:0 0 12px}.stem{white-space:pre-wrap;font-size:18px;line-height:1.48;margin-bottom:16px}.alt{display:block;width:100%;text-align:left;border:2px solid #c8d6e5;background:#fff;border-radius:12px;padding:13px 14px;margin:9px 0;font-size:17px;line-height:1.35}.alt.sel{border-color:var(--azul);background:var(--azul2)}.alt.correct{border-color:var(--verde);background:#eaf8f0}.alt.wrong{border-color:var(--vermelho);background:#ffeded}
.feedback{margin-top:14px;padding:12px;border-radius:10px;font-weight:800;display:none}.feedback.ok{display:block;background:#eaf8f0;color:#0e683b}.feedback.no{display:block;background:#ffeded;color:#9d1c1c}.confirm{width:100%;border:0;border-radius:12px;padding:15px;background:var(--azul);color:#fff;font-size:18px;font-weight:900;margin-top:14px}.confirm:disabled{opacity:.45}.resolution{font-size:18px;line-height:1.55;background:#f8fbff;border:1px solid #d9e7f4;border-radius:12px;padding:16px}.gabarito{font-size:23px;font-weight:900;color:var(--verde);margin-bottom:12px}.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#fff;border-top:1px solid #d8e0e8;padding:10px 12px;display:flex;gap:8px}.nav{flex:1;border:0;border-radius:10px;padding:13px 8px;font-weight:800;font-size:15px;background:#e7eef6;color:#123}.nav.primary{background:var(--azul);color:#fff}.nav:disabled{opacity:.4}.done{text-align:center;padding:40px 15px}.done h2{color:var(--azul);font-size:28px}.score{font-size:24px;font-weight:900;margin:20px}
@media(max-width:480px){.stem,.resolution{font-size:17px}.alt{font-size:16px}.qtitle{font-size:21px}.brand{font-size:16px}}
</style></head><body><div class="app"><header class="top"><div class="brand">Curso de Contabilidade Professor Moreira</div><div class="sub">Revisão de Contabilidade Geral • FGV</div><div id="progress" class="progress"></div></header><main id="screen" class="screen"></main><footer class="footer"><button id="prev" class="nav">← Voltar</button><button id="restart" class="nav">↻ Reiniciar</button><button id="next" class="nav primary">Resolução →</button></footer></div><script>const DATA=[{"n": 1, "header": "FGV - Ana GM (Pref SJC)/Pref SJC/Ciências Contábeis/2024", "stem": "Em 2022, os sócios de uma empresa aumentaram o capital social por meio da\nintegralização de um terreno, que era avaliado em R$50.000.\n\nNo ano seguinte, a empresa vendeu o terreno para terceiros, a prazo, por R$50.000, sem auferir\nlucro ou prejuízo.\n\nAssinale a opção que indica as variações nos saldos dos elementos patrimoniais, na data da venda.", "alts": [["A", "Não há variação nos saldos."], ["B", "Aumento no passivo; diminuição no ativo."], ["C", "Aumento no passivo; diminuição no patrimônio líquido."], ["D", "Diminuição no ativo; aumento no patrimônio líquido."], ["E", "Diminuição no ativo; diminuição no patrimônio líquido."]], "answer": "A", "resolution": "Na venda a prazo por R$ 50.000, sai o terreno (ativo) e entra Contas a Receber (ativo) pelo mesmo valor. O total do Ativo não muda e não há efeito no Passivo nem no Patrimônio Líquido, pois não houve lucro nem prejuízo. Gabarito: A."}, {"n": 2, "header": "FGV - Ana GM (Pref SJC)/Pref SJC/Ciências Contábeis/2024", "stem": "A Cia Contábil presta serviços de consultoria. Ela tem participação permanente na Cia\nDecoração, classificando-a como coligada.\n\nEm 30/12/2022, a Cia Contábil emprestou à Cia Decoração R$50.000 para recebimento em\n31/10/2023.\n\nAssinale a opção que indica, respectivamente, a contabilização da participação na Cia Decoração\ne do empréstimo realizado a ela, no balanço patrimonial da Cia Contábil, em 31/12/2022.", "alts": [["A", "Investimentos, Investimentos."], ["B", "Investimentos, Ativo Circulante."], ["C", "Ativo Imobilizado, Ativo Circulante."], ["D", "Investimentos, Ativo Realizável a Longo Prazo."], ["E", "Ativo Realizável a Longo Prazo, Ativo Realizável a Longo Prazo."]], "answer": "D", "resolution": "A participação permanente em coligada é classificada em Investimentos. Já o empréstimo a parte relacionada, quando não decorre da atividade operacional usual, fica no Ativo Realizável a Longo Prazo, independentemente do vencimento de curto prazo. Gabarito: D."}, {"n": 3, "header": "FGV - Ana Leg III (ALESC)/ALESC/Contador/2024", "stem": "Uma papelaria incorreu nos seguintes gastos em janeiro de 2024:\n\n Energia elétrica:.................................................................R$5.000;\n Depreciação dos ativos imobilizados:..............................R$20.000;\n Salários dos empregados:................................................R$30.000;\n Custo da mercadoria vendida no período: ......................R$50.000.\n\nAssinale a opção que indica o montante reconhecido como despesa de forma ampla nesse mês.", "alts": [["A", "R$20.000."], ["B", "R$50.000."], ["C", "R$70.000."], ["D", "R$75.000."], ["E", "R$105.000."]], "answer": "E", "resolution": "Despesa em sentido amplo abrange as despesas do período e também o custo da mercadoria vendida: energia 5.000 + depreciação 20.000 + salários 30.000 + CMV 50.000 = R$ 105.000. Gabarito: E."}, {"n": 4, "header": "FGV - Tec Leg (ALEP)/ALEP/Técnico em Contabilidade/2024", "stem": "Em 31/12/2023, os seguintes saldos eram apresentados no balanço patrimonial de uma\ninstituição de ensino:\n\n Salários a pagar: ............................................................... R$40.000;\n Aluguel antecipado: ......................................................... R$60.000;\n Empréstimos obtidos: ...................................................... R$80.000;\n Móveis e computadores: ............................................... R$200.000;\n Disponibilidades: ........................................................... R$400.000.\n\nAssinale a opção que indica o saldo do patrimônio líquido da instituição em 31/12/2023.", "alts": [["A", "R$420.000."], ["B", "R$520.000."], ["C", "R$540.000."], ["D", "R$660.000."], ["E", "R$700.000."]], "answer": "C", "resolution": "Ativos: aluguel antecipado 60.000 + móveis/computadores 200.000 + disponibilidades 400.000 = 660.000. Passivos: salários 40.000 + empréstimos 80.000 = 120.000. PL = Ativo - Passivo = 660.000 - 120.000 = R$ 540.000. Gabarito: C."}, {"n": 5, "header": "FGV - Cont (Pref Caraguatatuba)/Pref Caraguatatuba/2024", "stem": "Em 31/12/2022, uma sociedade empresária apresentava as seguintes contas em seus ativos.\n\n • Contas a receber de clientes: R$50.000\n • Contas a receber de partes relacionadas, decorrentes de transações operacionais:\n R$45.000.\n • Contas a receber de partes relacionadas, não decorrentes de transações operacionais:\n R$30.000.\n\nOs três recebimentos estavam previstos para março de 2023.\n\nNo Balanço Patrimonial da sociedade empresária, os saldos do ativo circulante e do ativo\nrealizável a longo prazo, em 31/12/2022, eram, respectivamente, de", "alts": [["A", "Zero e R$125.000."], ["B", "R$50.000 e R$75.000."], ["C", "R$80.000 e R$45.000."], ["D", "R$95.000 e R$30.000."], ["E", "R$125.000 e zero."]], "answer": "D", "resolution": "Clientes (50.000) e parte relacionada operacional (45.000), ambos com recebimento no exercício seguinte, ficam no Ativo Circulante: R$ 95.000. O crédito de R$ 30.000 com parte relacionada não operacional vai para o Realizável a Longo Prazo. Gabarito: D."}, {"n": 6, "header": "FGV - Cont (Pref Caraguatatuba)/Pref Caraguatatuba/2024", "stem": "Em uma entidade, os passivos podem ser circulantes e não circulantes.\n\nDe acordo com a NBC TG 26 (R5) – Apresentação das Demonstrações Contábeis, assinale a\nopção que indica um critério para que o passivo seja classificado como não circulante.", "alts": [["A", "É composto pelos passivos permanentes da entidade."], ["B", "É mantido essencialmente para a finalidade de ser negociado."], ["C", "Deve ser liquidado no período de até doze meses após a data do balanço."], ["D", "Espera-se que seja liquidado em prazo superior ao ciclo operacional normal da entidade."], ["E", "A entidade não tem direito incondicional de diferir a liquidação do passivo durante pelo\nmenos doze meses após a data do balanço."]], "answer": "D", "resolution": "O passivo é não circulante quando não atende aos critérios de circulante. Entre as alternativas, a correta é a obrigação cuja liquidação se espera em prazo superior ao ciclo operacional normal. Gabarito: D."}, {"n": 7, "header": "FGV - Cont (Pref Caraguatatuba)/Pref Caraguatatuba/2024", "stem": "No balanço patrimonial de uma sociedade empresária, o patrimônio líquido representa", "alts": [["A", "as obrigações com terceiros."], ["B", "o valor contábil pertencente aos acionistas ou sócios."], ["C", "os ativos que foram integralizados pelos proprietários."], ["D", "os bens e os direitos com expectativa de retorno futuro."], ["E", "a diferença entre as aplicações e as origens de recursos."]], "answer": "B", "resolution": "Patrimônio Líquido é o interesse residual nos ativos depois de deduzidos os passivos; representa contabilmente a parcela atribuível aos proprietários. Gabarito: B."}, {"n": 8, "header": "FGV - Tec (Pref Caraguatatuba)/Pref Caraguatatuba/Contabilidade/2024", "stem": "Em 01/01/2020, uma sociedade empresária obteve um empréstimo bancário de R$18.000,\npara pagamento em 01/01/2022. Os juros mensais são de R$1.000, pagos semestralmente.\n\nAssinale a opção que indica a apresentação do empréstimo no passivo da sociedade empresária,\nem 01/01/2020.", "alts": [["A", "Não circulante: R$42.000."], ["B", "Circulante: R$18.000."], ["C", "Não circulante: R$18.000."], ["D", "Circulante: R$12.000; não circulante: R$30.000."], ["E", "Circulante: R$24.000; não circulante: R$18.000."]], "answer": "C", "resolution": "Na data inicial, reconhece-se o principal recebido de R$ 18.000. Como o vencimento do principal é em 01/01/2022, ele é não circulante em 01/01/2020. Juros futuros não são somados ao valor inicial da dívida. Gabarito: C."}, {"n": 9, "header": "FGV - Prof NS (SES MT)/SES MT/Contador/2024", "stem": "Os seguintes saldos são apresentados no balanço patrimonial de uma sociedade empresária,\nque presta serviços de arquitetura, em 31/12/2023: adiantamentos concedidos a acionistas (90\ndias): R$30.000; disponibilidades: R$50.000; empréstimos à sociedade coligada (120 dia):\nR$70.000; clientes (60 dias): R$80.000; terreno utilizado na atividade fim: R$90.000.\n\nAssinale a opção que indica o saldo do ativo realizável a longo prazo da sociedade empresária,\nem 31/12/2023.", "alts": [["A", "Zero."], ["B", "R$30.000."], ["C", "R$50.000."], ["D", "R$100.000."]], "answer": "D", "resolution": "Adiantamento a acionista (30.000) e empréstimo a coligada (70.000) são créditos com partes relacionadas e, no caso apresentado, integram o Realizável a Longo Prazo. Total: R$ 100.000. Gabarito: D."}, {"n": 10, "header": "FGV - Aud CE (TCE-PA)/TCE PA/Fiscalização/Contabilidade/2024", "stem": "Em 01/07/2022, uma sociedade empresária contraiu um empréstimo de R$180.000 com\nprazo de três anos. De acordo com o contrato, a sociedade empresária deveria amortizar\nR$30.000 do empréstimo no penúltimo dia de cada semestre. Além disso, os juros fixos eram\nde R$5.000, pagos ao final de cada trimestre.\n\nNo Balanço Patrimonial da sociedade empresária, em 31/12/2022, o empréstimo é apresentado\ndo seguinte modo:", "alts": [["A", "Passivo não Circulante: R$105.000."], ["B", "Passivo Circulante: R$30.000; Passivo não Circulante: R$120.000."], ["C", "Passivo Circulante: R$60.000; Passivo não Circulante: R$90.000."], ["D", "Passivo Circulante: R$35.000; Passivo não Circulante: R$140.000."], ["E", "Passivo não Circulante: R$150.000; Passivo Circulante: R$70.000."]], "answer": "C", "resolution": "Após a amortização de R$ 30.000 no fim de 2022, o principal é R$ 150.000. Nos 12 meses seguintes vencem duas parcelas de R$ 30.000 = R$ 60.000 no Passivo Circulante. O restante, R$ 90.000, fica no Não Circulante. Gabarito: C."}, {"n": 11, "header": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024", "stem": "Conforme a Lei nº 6.404/76, no Balanço Patrimonial, as contas do ativo são apresentadas\nde acordo com a ordem decrescente de grau de", "alts": [["A", "liquidez."], ["B", "relevância."], ["C", "objetividade."], ["D", "valor monetário."]], "answer": "A", "resolution": "Pela Lei 6.404/76, as contas do Ativo são dispostas em ordem decrescente de grau de liquidez. Gabarito: A."}, {"n": 12, "header": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024", "stem": "Uma farmácia apresentava os seguintes saldos em seu ativo, em 31/12/2023:\n\n • Aplicação financeira com vencimento em 380 dias: R$200.000;\n • Clientes com recebimento previsto para 180 dias: R$140.000;\n • Disponibilidades: R$50.000;\n • Estoque com venda prevista para até 60 dias: R$120.000;\n • Imóvel onde funciona a farmácia: R$600.000;\n • Móveis e utensílios utilizados em suas lojas: R$ 300.000.\n\nO ativo circulante da farmácia em 31/12/2023 foi de", "alts": [["A", "R$170.000."], ["B", "R$190.000."], ["C", "R$310.000."], ["D", "R$510.000."]], "answer": "C", "resolution": "Ativo Circulante: clientes 140.000 + disponibilidades 50.000 + estoque 120.000 = R$ 310.000. A aplicação com vencimento em 380 dias é não circulante; imóvel e móveis são imobilizado. Gabarito: C."}, {"n": 13, "header": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024", "stem": "Em 31/12/2023, a Cia Lua apresentava os seguintes saldos em seu ativo:\n\n Aplicações financeiras com vencimento em 720 dias: ........................ R$70.000;\n Clientes com previsão de recebimento em 380 dias: .......................... R$60.000;\n Disponibilidades: ................................................................................. R$50.000;\n Estoques com previsão de venda em até 180 dias: ............................. R$40.000;\n Perdas estimadas com crédito de liquidação duvidosa: ........................ R$6.000;\n Perdas estimadas com desvalorização de estoque: ............................... R$8.000.\n\nAssinale a opção que indica o saldo do ativo circulante em 31/12/2023.", "alts": [["A", "R$76.000."], ["B", "R$82.000."], ["C", "R$90.000."], ["D", "R$136.000."]], "answer": "B", "resolution": "No circulante entram disponibilidades 50.000 e estoques 40.000, deduzidos da perda estimada dos estoques de 8.000. Assim: 50.000 + 40.000 - 8.000 = R$ 82.000. Gabarito: B."}, {"n": 14, "header": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024", "stem": "Em relação aos ativos, no Balanço Patrimonial de uma entidade, assinale a afirmativa\ncorreta, de acordo com a Lei nº 6.404/76 e alterações.", "alts": [["A", "No intangível estão as participações permanentes em outras sociedades e os direitos de\nqualquer natureza, não classificáveis no ativo circulante."], ["B", "No imobilizado estão os direitos que tenham por objeto bens incorpóreos destinados à\nmanutenção da companhia ou exercidos com essa finalidade."], ["C", "Em investimentos estão os direitos que tenham por objeto bens corpóreos destinados à\nmanutenção das atividades da entidade ou exercidos com essa finalidade."], ["D", "No circulante estão as disponibilidades, os direitos realizáveis no curso do exercício social\nsubsequente e as aplicações de recursos em despesas do exercício seguinte."]], "answer": "D", "resolution": "A Lei 6.404/76 inclui no circulante as disponibilidades, direitos realizáveis no exercício social subsequente e aplicações em despesas do exercício seguinte. As demais alternativas trocam conceitos de investimentos, imobilizado e intangível. Gabarito: D."}, {"n": 15, "header": "FGV - AFRE MG/SEF MG/Auditoria e Fiscalização/2023", "stem": "De acordo com inclusão feita pela Lei nº 11.638/07 na Lei nº 6.404/64, assinale a opção\nque indica a classificação no ativo intangível.", "alts": [["A", "Despesas pré-operacionais e gastos de reestruturação que contribuirão, efetivamente, para o\naumento do resultado de mais de um exercício social."], ["B", "Direitos que tenham por objeto bens incorpóreos destinados à manutenção da companhia ou\nexercidos com essa finalidade, inclusive o fundo de comércio adquirido."], ["C", "Aplicações de recursos em despesas que contribuirão para a formação do resultado de mais\nde um exercício social, inclusive os juros pagos ou creditados aos acionistas."], ["D", "Direitos que tenham por objeto bens destinados à manutenção das atividades da companhia\ne da sociedade empresária, ou exercidos com essa finalidade, inclusive os de propriedade\nindustrial ou comercial."], ["E", "Participações permanentes em outras sociedades e os direitos de qualquer natureza, não\nclassificáveis no ativo circulante, e que não se destinem à manutenção da atividade da\ncompanhia ou da sociedade empresária."]], "answer": "B", "resolution": "Intangível compreende direitos sobre bens incorpóreos destinados à manutenção da companhia ou exercidos com essa finalidade, inclusive fundo de comércio adquirido. Gabarito: B."}];
const qs=DATA; let i=0, mode='q', selected=null, locked=false, score=0;
const app=document.getElementById('screen'), prog=document.getElementById('progress');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){ const q=qs[i]; prog.textContent=`Questão ${i+1} de ${qs.length} • ${mode==='q'?'QUESTÃO':'RESOLUÇÃO'}`;
 if(mode==='q'){ app.innerHTML=`<div class="meta">${esc(q.header)}</div><div class="qtitle">QUESTÃO ${q.n}</div><div class="stem">${esc(q.stem)}</div><div id="alts">${q.alts.map(a=>`<button class="alt" data-l="${a[0]}"><b>${a[0]})</b> ${esc(a[1])}</button>`).join('')}</div><div id="fb" class="feedback"></div><button id="confirm" class="confirm" disabled>Confirmar Resposta</button>`;
  selected=null; locked=false; document.querySelectorAll('.alt').forEach(b=>b.onclick=()=>{if(locked)return;selected=b.dataset.l;document.querySelectorAll('.alt').forEach(x=>x.classList.toggle('sel',x===b));document.getElementById('confirm').disabled=false}); document.getElementById('confirm').onclick=confirm;
 } else {app.innerHTML=`<div class="meta">${esc(q.header)}</div><div class="qtitle">RESOLUÇÃO • QUESTÃO ${q.n}</div><div class="gabarito">Gabarito: ${q.answer}</div><div class="resolution">${esc(q.resolution)}</div>`;} nav(); window.scrollTo(0,0)}
function confirm(){if(!selected||locked)return;locked=true; const q=qs[i], ok=selected===q.answer;if(ok)score++;document.querySelectorAll('.alt').forEach(b=>{if(b.dataset.l===q.answer)b.classList.add('correct');if(b.dataset.l===selected&&!ok)b.classList.add('wrong');b.disabled=true});let fb=document.getElementById('fb');fb.className='feedback '+(ok?'ok':'no');fb.textContent=ok?'🟢 Resposta correta!':'🔴 Resposta incorreta. Veja a resolução na próxima tela.';document.getElementById('confirm').disabled=true;nav()}
function nav(){document.getElementById('prev').disabled=(i===0&&mode==='q');document.getElementById('next').textContent=mode==='q'?'Resolução →':(i===qs.length-1?'Finalizar':'Próxima →')}
document.getElementById('prev').onclick=()=>{if(mode==='r'){mode='q'}else if(i>0){i--;mode='r'}render()};
document.getElementById('next').onclick=()=>{if(mode==='q'){mode='r';render()}else if(i<qs.length-1){i++;mode='q';render()}else{prog.textContent='Concluído';app.innerHTML=`<div class="done"><h2>Quiz concluído!</h2><div class="score">Acertos: ${score} / ${qs.length}</div><p>Curso de Contabilidade Professor Moreira</p></div>`;document.getElementById('prev').disabled=false;document.getElementById('next').disabled=true}};
document.getElementById('restart').onclick=()=>{i=0;mode='q';score=0;document.getElementById('next').disabled=false;render()}; render();
</script></body></html>
